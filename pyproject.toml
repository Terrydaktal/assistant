[project]
name = "assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "english-variant-converter",
    "fastapi>=0.137.1",
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cudnn-cu12==9.19.0.56",
    "python-multipart>=0.0.32",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
canary = [
    "nemo-toolkit[asr]",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]
parakeet = [
    "nemo-toolkit[asr]",
    "silero-vad>=6.2.1",
    "soundfile>=0.14.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]
granite-speech = [
    "httpx>=0.28.1",
]

[tool.uv.sources]
english-variant-converter = { git = "https://github.com/TrelisResearch/whisper-english-variant-converter.git" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
