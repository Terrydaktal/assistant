[project]
name = "assistant-consensus-cohere"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "librosa>=0.11.0",
    "silero-vad>=6.2.1",
    "soundfile>=0.14.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "transformers==5.14.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
